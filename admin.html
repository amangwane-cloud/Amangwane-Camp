<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staff Bookings | Amangwane</title>
<style>
:root{--ink:#1c1c2a;--paper:#fffef8;--sand:#f7f3ea;--sun:#f5c518;--ocean:#1a8cb5;--forest:#2a6e2a;--red:#a33b2b;--muted:#6a6a7a;--line:rgba(28,28,42,.14)}*{box-sizing:border-box}body{margin:0;background:var(--sand);color:var(--ink);font:15px Arial,sans-serif}header{background:var(--ink);color:white;padding:1rem 5vw;display:flex;justify-content:space-between;align-items:center}header strong{font:700 1.25rem Georgia,serif}header span{font-size:.7rem;color:#bbb;letter-spacing:.12em;text-transform:uppercase}.shell{max-width:1200px;margin:auto;padding:2.5rem 2rem}.top{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}.eyebrow{font-size:.7rem;font-weight:bold;color:var(--ocean);letter-spacing:.16em;text-transform:uppercase}.top h1{font:700 2.6rem Georgia,serif;margin:.4rem 0 0}.actions{display:flex;gap:.6rem;flex-wrap:wrap}button{border:0;border-radius:5px;padding:.75rem 1rem;font-weight:bold;cursor:pointer;background:var(--sun);color:var(--ink)}button.secondary{background:white;border:1px solid var(--line)}button.danger{background:#f7dfda;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}.stat,.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1.25rem}.stat strong{display:block;font:700 1.8rem Georgia,serif}.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.panel{overflow:auto}.panel h2{font:700 1.3rem Georgia,serif;margin:0 0 1rem}.board{display:grid;grid-template-columns:150px repeat(14,minmax(70px,1fr));min-width:1150px;border:1px solid var(--line)}.board div{min-height:54px;padding:.45rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.7rem}.head{background:var(--ink);color:white;font-weight:bold}.room-name{background:white;font-weight:bold}.available{background:#eaf3ea;color:var(--forest)}.booked{background:#dceff6;color:#075d79;font-weight:bold}.pending{background:#fff4c7;color:#7b6000;font-weight:bold}.blocked{background:#eee;color:#777}.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:1rem}.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:.25rem}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:left;padding:.75rem;border-bottom:1px solid var(--line);font-size:.8rem}.table th{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.status{font-size:.68rem;font-weight:bold;padding:.25rem .45rem;border-radius:4px;background:#fff4c7}.status.confirmed{background:#eaf3ea;color:var(--forest)}.status.cancelled{background:#f7dfda;color:var(--red)}.empty{color:var(--muted);padding:1rem 0}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.shell{padding:2rem 1rem}.top h1{font-size:2rem}}
</style>
</head>
<body><header><strong>Amangwane Staff</strong><span>Bookings desk</span></header><main class="shell"><div class="top"><div><div class="eyebrow">Operations</div><h1>Booking overview</h1></div><div class="actions"><a href="booking.html"><button>Open public booking</button></a><button class="secondary" onclick="refresh()">Refresh</button><button class="danger" onclick="clearDemo()">Clear demo data</button></div></div><section class="stats"><div class="stat"><strong id="totalBookings">0</strong><span>Total bookings</span></div><div class="stat"><strong id="pendingBookings">0</strong><span>Deposit pending</span></div><div class="stat"><strong id="confirmedBookings">0</strong><span>Confirmed</span></div><div class="stat"><strong id="revenue">R0</strong><span>Quoted value</span></div></section><section class="panel"><h2>14-day availability board</h2><div id="board"></div><div class="legend"><span><i style="background:#eaf3ea"></i>Available</span><span><i style="background:#dceff6"></i>Booked</span><span><i style="background:#fff4c7"></i>Deposit pending</span><span><i style="background:#eee"></i>Maintenance</span></div></section><section class="panel" style="margin-top:1.5rem"><h2>Booking register</h2><div id="register"></div></section></main>
<script>
const units=[...Array.from({length:8},(_,i)=>({id:`tent-${i+1}`,name:`Tent ${i+1}`,label:'Standard 2-bed'})),{id:'tent-9',name:'Tent 9',label:'3-sleeper'},{id:'tent-10',name:'Tent 10',label:'Family unit'}];
const money=value=>`R${Math.round(value).toLocaleString('en-ZA')}`;
function getBookings(){return JSON.parse(localStorage.getItem('amangwane_bookings')||'[]')}
function day(offset){const date=new Date();date.setHours(0,0,0,0);date.setDate(date.getDate()+offset);return date}
function iso(date){return date.toISOString().slice(0,10)}
function bookingFor(unitId,date){return getBookings().find(b=>b.unitId===unitId&&b.status!=='cancelled'&&date>=b.checkin&&date<b.checkout)}
function refresh(){const bookings=getBookings();document.getElementById('totalBookings').textContent=bookings.length;document.getElementById('pendingBookings').textContent=bookings.filter(b=>b.status==='deposit-pending').length;document.getElementById('confirmedBookings').textContent=bookings.filter(b=>b.status==='confirmed').length;document.getElementById('revenue').textContent=money(bookings.reduce((sum,b)=>sum+Number(b.total||0),0));let html='<div class="board"><div class="head">Tent</div>';for(let i=0;i<14;i++){const d=day(i);html+=`<div class="head">${d.toLocaleDateString('en-ZA',{day:'numeric',month:'short'})}</div>`}units.forEach(u=>{html+=`<div class="room-name">${u.name}<br><small>${u.label}</small></div>`;for(let i=0;i<14;i++){const b=bookingFor(u.id,iso(day(i)));html+=`<div class="${b?(b.status==='confirmed'?'booked':'pending'):'available'}">${b?b.guest:'Free'}</div>`}});html+='</div>';document.getElementById('board').innerHTML=html;if(!bookings.length){document.getElementById('register').innerHTML='<p class="empty">No demo bookings yet. Create one from the public booking page.</p>';return}document.getElementById('register').innerHTML='<table class="table"><thead><tr><th>Reference</th><th>Guest</th><th>Tent</th><th>Dates</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+bookings.map(b=>`<tr><td>${b.id}</td><td>${b.guest}<br><small>${b.email}</small></td><td>${b.unit}</td><td>${b.checkin} to ${b.checkout}</td><td>${money(b.total)}<br><small>Deposit ${money(b.deposit)}</small></td><td><span class="status ${b.status}">${b.status}</span></td><td>${b.status!=='cancelled'?`<button onclick="confirmBooking('${b.id}')">Confirm deposit</button> <button class="danger" onclick="cancelBooking('${b.id}')">Cancel</button>`:'-'}</td></tr>`).join('')+'</tbody></table>'}
function update(id,status){const bookings=getBookings().map(b=>b.id===id?{...b,status}:b);localStorage.setItem('amangwane_bookings',JSON.stringify(bookings));refresh()}
function confirmBooking(id){update(id,'confirmed')}
function cancelBooking(id){update(id,'cancelled')}
function clearDemo(){if(confirm('Clear all prototype booking data?')){localStorage.removeItem('amangwane_bookings');refresh()}}
refresh();
</script></body></html>
